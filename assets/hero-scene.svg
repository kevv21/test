<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#f4c430" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#e23b3b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e0e0e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Resplandor de escenario -->
  <rect width="1440" height="820" fill="url(#glow)"/>

  <!-- PIZZA grande difuminada, arriba a la derecha -->
  <g transform="translate(1170 150)" opacity="0.10" stroke="#f4c430" stroke-width="3" fill="none">
    <circle r="210"/>
    <circle r="175" stroke-dasharray="2 16"/>
    <!-- cortes -->
    <g stroke-width="2">
      <line x1="-175" y1="0" x2="175" y2="0"/>
      <line x1="0" y1="-175" x2="0" y2="175"/>
      <line x1="-124" y1="-124" x2="124" y2="124"/>
      <line x1="124" y1="-124" x2="-124" y2="124"/>
    </g>
    <!-- pepperonis -->
    <g fill="#f4c430" stroke="none">
      <circle cx="70" cy="-60" r="14"/><circle cx="-60" cy="-80" r="11"/>
      <circle cx="-95" cy="40" r="13"/><circle cx="40" cy="95" r="12"/>
      <circle cx="100" cy="60" r="10"/><circle cx="-30" cy="-10" r="9"/>
    </g>
  </g>

  <!-- GUITARRA eléctrica estilizada, abajo a la izquierda -->
  <g transform="translate(180 560) rotate(-28)" opacity="0.10" stroke="#ece6d8" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- cuerpo -->
    <path d="M-40 60 c-55 -10 -70 60 -20 88 c40 22 96 8 110 -34 c10 -30 -6 -52 -30 -58 c10 -34 -2 -60 -30 -64 c-26 -4 -34 22 -20 40 Z"/>
    <!-- mástil -->
    <line x1="40" y1="-30" x2="170" y2="-160"/>
    <rect x="160" y="-196" width="34" height="44" rx="6" transform="rotate(45 177 -174)"/>
    <!-- cuerdas -->
    <line x1="-10" y1="60" x2="150" y2="-100" stroke-width="1.5"/>
    <line x1="6" y1="74" x2="166" y2="-86" stroke-width="1.5"/>
  </g>

  <!-- ONDA DE SONIDO en la base -->
  <g transform="translate(0 720)" opacity="0.14" fill="#f4c430">
    <g>
      <rect x="120"  y="-20" width="7" height="20" rx="3"/>
      <rect x="150"  y="-46" width="7" height="46" rx="3"/>
      <rect x="180"  y="-72" width="7" height="72" rx="3"/>
      <rect x="210"  y="-34" width="7" height="34" rx="3"/>
      <rect x="240"  y="-58" width="7" height="58" rx="3"/>
      <rect x="270"  y="-90" width="7" height="90" rx="3"/>
      <rect x="300"  y="-40" width="7" height="40" rx="3"/>
      <rect x="330"  y="-66" width="7" height="66" rx="3"/>
      <rect x="1100" y="-30" width="7" height="30" rx="3"/>
      <rect x="1130" y="-60" width="7" height="60" rx="3"/>
      <rect x="1160" y="-86" width="7" height="86" rx="3"/>
      <rect x="1190" y="-44" width="7" height="44" rx="3"/>
      <rect x="1220" y="-70" width="7" height="70" rx="3"/>
      <rect x="1250" y="-36" width="7" height="36" rx="3"/>
      <rect x="1280" y="-54" width="7" height="54" rx="3"/>
    </g>
  </g>

  <!-- Estrellas y púas dispersas -->
  <g fill="none" stroke="#f4c430" stroke-width="2.5" stroke-linejoin="round" opacity="0.18">
    <path d="M360 120 L364 132 L377 132 L367 140 L370 153 L360 145 L350 153 L353 140 L343 132 L356 132 Z"/>
    <path d="M1040 90 L1044 102 L1057 102 L1047 110 L1050 123 L1040 115 L1030 123 L1033 110 L1023 102 L1036 102 Z"/>
    <path d="M250 230 L253 240 L263 240 L255 246 L258 256 L250 250 L242 256 L245 246 L237 240 L247 240 Z"/>
  </g>
</svg>
